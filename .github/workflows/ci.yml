name: CI

on:
  push:
    # WORKFLOW.md обещает CI на каждый пуш в ветки и master: тест-ветка тикета
    # проверяется до мержа, а не только master после него.
    branches: ["**"]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
